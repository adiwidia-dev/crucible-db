name: tests

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release metadata
        run: |
          version="$(jq -r .version package.json)"
          release_tag="v$version"
          expected_release_badge="  <a href=\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag\"><img src=\"https://img.shields.io/badge/release-$release_tag-2563EB\" alt=\"Crucible DB $release_tag\"></a>"

          grep -Fqx "$expected_release_badge" README.md || {
            echo "The README release badge link, label, and alt text must match package.json version $version."
            exit 1
          }

          grep -Fqx "  release_version: $release_tag" mkdocs.yml || {
            echo "The documentation release label must match package.json version $version."
            exit 1
          }

          grep -Fqx "  release_url: https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag" mkdocs.yml || {
            echo "The documentation release URL must match package.json version $version."
            exit 1
          }

          grep -Fqx "      - Release notes $release_tag: releases/$release_tag.md" mkdocs.yml || {
            echo "The current release notes must be present in the documentation navigation."
            exit 1
          }

          release_notes="docs/releases/$release_tag.md"
          test -f "$release_notes" || {
            echo "Release notes are missing at $release_notes."
            exit 1
          }

          grep -Fqx "# Crucible DB $release_tag" "$release_notes" || {
            echo "The release-notes title must match package.json version $version."
            exit 1
          }

          grep -Fq "## [$version] - " CHANGELOG.md || {
            echo "CHANGELOG.md must include release $version."
            exit 1
          }

          grep -Fqx "[Unreleased]: https://github.com/$GITHUB_REPOSITORY/compare/$release_tag...HEAD" CHANGELOG.md || {
            echo "The Unreleased changelog link must start at $release_tag."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  application-database-matrix:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crucible_control_test
          POSTGRES_USER: crucible
          POSTGRES_PASSWORD: crucible_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crucible -d crucible_control_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: crucible_control_test
          MYSQL_USER: crucible
          MYSQL_PASSWORD: crucible_test
          MYSQL_ROOT_PASSWORD: crucible_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ucrucible -pcrucible_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        run: |
          cp .env.example .env
          touch database/database.sqlite
          composer install --no-interaction --prefer-dist
          php artisan key:generate --no-interaction

      - name: Verify PostgreSQL migration history
        run: php artisan migrate:fresh --force --no-interaction
        env:
          CRUCIBLE_DATABASE_CONFIG_MODE: environment
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: crucible_control_test
          DB_USERNAME: crucible
          DB_PASSWORD: crucible_test
          DB_SSLMODE: disable

      - name: Verify MySQL migration history
        run: php artisan migrate:fresh --force --no-interaction
        env:
          CRUCIBLE_DATABASE_CONFIG_MODE: environment
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: crucible_control_test
          DB_USERNAME: crucible
          DB_PASSWORD: crucible_test

      - name: Verify first-run network provisioning
        run: php artisan test --compact tests/Feature/ApplicationDatabaseProvisioningMatrixTest.php
        env:
          CONTROL_DATABASE_POSTGRES_HOST: 127.0.0.1
          CONTROL_DATABASE_MYSQL_HOST: 127.0.0.1
