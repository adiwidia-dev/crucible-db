name: release cli and production images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish
        required: true
        type: string
      release_components:
        description: Artifacts to publish or recover
        required: true
        default: all
        type: choice
        options:
          - all
          - images
          - cli
          - attestation

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: validate release configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.release.outputs.build_date }}
      release_components: ${{ steps.release.outputs.release_components }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable release tag and Docker Hub configuration
        id: release
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_COMPONENTS_INPUT: ${{ inputs.release_components }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          release_components="all"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$RELEASE_TAG_INPUT"
            release_components="$RELEASE_COMPONENTS_INPUT"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the stable vMAJOR.MINOR.PATCH format."
            exit 1
          fi

          release_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          version="${release_tag#v}"

          test "$(git show "$release_tag:package.json" | jq -r .version)" = "$version" || {
            echo "The release tag package version must match $version."
            exit 1
          }

          expected_release_badge="  <a href=\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag\"><img src=\"https://img.shields.io/badge/release-$release_tag-2563EB\" alt=\"Crucible DB $release_tag\"></a>"
          git show "$release_tag:README.md" | grep -Fqx "$expected_release_badge" || {
            echo "The README release badge link, label, and alt text must match $release_tag."
            exit 1
          }

          git show "$release_tag:mkdocs.yml" | grep -Fqx "  release_version: $release_tag" || {
            echo "The documentation release label must match $release_tag."
            exit 1
          }

          git show "$release_tag:mkdocs.yml" | grep -Fqx "  release_url: https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag" || {
            echo "The documentation release URL must match $release_tag."
            exit 1
          }

          git show "$release_tag:mkdocs.yml" | grep -Fqx "      - Release notes $release_tag: releases/$release_tag.md" || {
            echo "The current release notes must be present in the documentation navigation."
            exit 1
          }

          release_notes="docs/releases/$release_tag.md"
          git cat-file -e "$release_tag:$release_notes" || {
            echo "Release notes are missing at $release_notes."
            exit 1
          }

          git show "$release_tag:$release_notes" | grep -Fqx "# Crucible DB $release_tag" || {
            echo "The release-notes title must match $release_tag."
            exit 1
          }

          git show "$release_tag:CHANGELOG.md" | grep -Fq "## [$version] - " || {
            echo "CHANGELOG.md must include release $version."
            exit 1
          }

          git show "$release_tag:CHANGELOG.md" | grep -Fqx "[Unreleased]: https://github.com/$GITHUB_REPOSITORY/compare/$release_tag...HEAD" || {
            echo "The Unreleased changelog link must start at $release_tag."
            exit 1
          }

          if [[ "$release_components" == "all" || "$release_components" == "images" ]]; then
            test "$DOCKERHUB_USERNAME" = "hephaestus" || {
              echo "DOCKERHUB_USERNAME must be configured as hephaestus."
              exit 1
            }
            test -n "$DOCKERHUB_TOKEN" || {
              echo "DOCKERHUB_TOKEN must contain a Docker Hub access token."
              exit 1
            }
          fi

          if [[ "$release_components" == "all" || "$release_components" == "cli" ]]; then
            test -n "$HOMEBREW_TAP_TOKEN" || {
              echo "HOMEBREW_TAP_TOKEN must have Contents: read and write access to adiwidia-dev/homebrew-tap."
              exit 1
            }
          fi

          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "release_components=$release_components"
            echo "release_sha=$release_sha"
            echo "release_tag=$release_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  application-gate:
    needs: release-preflight
    uses: ./.github/workflows/tests.yml

  native-gate:
    needs: release-preflight
    uses: ./.github/workflows/native.yml

  publish-images:
    name: publish production images
    needs: [release-preflight, application-gate, native-gate]
    if: ${{ needs.release-preflight.outputs.release_components == 'all' || needs.release-preflight.outputs.release_components == 'images' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.0.0

      - name: Generate application image metadata
        id: application-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: hephaestus/crucible-db
          tags: |
            type=raw,value=${{ needs.release-preflight.outputs.version }}
            type=raw,value=latest

      - name: Build and publish application image
        id: application-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.application-metadata.outputs.tags }}
          labels: ${{ steps.application-metadata.outputs.labels }}
          build-args: |
            CRUCIBLE_VERSION=${{ needs.release-preflight.outputs.version }}
            CRUCIBLE_REVISION=${{ needs.release-preflight.outputs.release_sha }}
          cache-from: type=gha,scope=production-application
          cache-to: type=gha,mode=max,scope=production-application
          provenance: mode=max
          sbom: true

      - name: Generate native proxy image metadata
        id: native-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: hephaestus/crucible-db-native
          tags: |
            type=raw,value=${{ needs.release-preflight.outputs.version }}
            type=raw,value=latest

      - name: Build and publish native proxy image
        id: native-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile.native
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.native-metadata.outputs.tags }}
          labels: ${{ steps.native-metadata.outputs.labels }}
          build-args: |
            CRUCIBLE_VERSION=${{ needs.release-preflight.outputs.version }}
            CRUCIBLE_REVISION=${{ needs.release-preflight.outputs.release_sha }}
            CRUCIBLE_BUILD_DATE=${{ needs.release-preflight.outputs.build_date }}
          cache-from: type=gha,scope=production-native-proxy
          cache-to: type=gha,mode=max,scope=production-native-proxy
          provenance: mode=max
          sbom: true

      - name: Verify published image manifests
        env:
          APPLICATION_DIGEST: ${{ steps.application-build.outputs.digest }}
          NATIVE_DIGEST: ${{ steps.native-build.outputs.digest }}
        run: |
          test -n "$APPLICATION_DIGEST"
          test -n "$NATIVE_DIGEST"
          docker buildx imagetools inspect "hephaestus/crucible-db@$APPLICATION_DIGEST"
          docker buildx imagetools inspect "hephaestus/crucible-db-native@$NATIVE_DIGEST"

  release:
    name: publish native cli
    needs: [release-preflight, application-gate, native-gate]
    if: ${{ needs.release-preflight.outputs.release_components == 'all' || needs.release-preflight.outputs.release_components == 'cli' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-preflight.outputs.release_tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Verify native test gate
        working-directory: native
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race ./...
      - name: Install keyless checksum signer
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install SBOM generator
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check --config .goreleaser.yaml
          workdir: native
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Build signed release candidate without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish --config .goreleaser.yaml
          workdir: native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify checksums, keyless signature, archives, packages, SBOMs, and cask metadata
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: scripts/verify-native-release.sh native/dist native/.goreleaser.yaml
      - name: Publish verified release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.yaml
          workdir: native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify published artifact bytes
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: scripts/verify-native-release.sh native/dist native/.goreleaser.yaml
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: native/dist/*

  attest-published-cli:
    name: attest published native cli
    needs: [release-preflight, application-gate, native-gate]
    if: ${{ needs.release-preflight.outputs.release_components == 'attestation' }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: native/go.sum
          go-version: '1.26.6'
      - name: Install keyless checksum verifier
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        run: |
          mkdir -p native/dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir native/dist
      - name: Verify published checksums, signatures, archives, packages, and SBOMs
        env:
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: scripts/verify-native-release.sh native/dist native/.goreleaser.yaml
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: native/dist/*
