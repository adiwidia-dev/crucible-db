services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment: &application-environment
      APP_ENV: production
      APP_DEBUG: "false"
      CACHE_STORE: redis
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/crucible.sqlite
      DB_FOREIGN_KEYS: "true"
      DB_BUSY_TIMEOUT: "5000"
      DB_JOURNAL_MODE: WAL
      DB_SYNCHRONOUS: FULL
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      SESSION_DRIVER: redis
    init: true
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    command:
      - sh
      - -lc
      - >-
        exec php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
        --workers="${OCTANE_WORKERS:-2}" --max-requests="${OCTANE_MAX_REQUESTS:-500}"
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment: *application-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["php", "artisan", "horizon"]
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment: *application-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      disable: true
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment: *application-environment
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: true
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped
    volumes:
      - crucible_redis:/data
    networks:
      - backend

volumes:
  crucible_redis:
  crucible_storage:

networks:
  backend:
    internal: true
