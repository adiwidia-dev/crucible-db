services:
  app:
    image: ${CRUCIBLE_IMAGE:-hephaestus/crucible-db:0.1.0}
    pull_policy: always
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      SESSION_DRIVER: redis
      NATIVE_PROXY_ENABLED: "true"
      NATIVE_PROXY_HEALTH_URL: http://native-proxy:8081/readyz
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped
    volumes:
      - crucible_redis:/data
    networks:
      - backend

  control-postgres:
    image: postgres:17-alpine
    profiles: ["control-postgres"]
    environment:
      POSTGRES_DB: ${CRUCIBLE_CONTROL_DATABASE_NAME:-crucible}
      POSTGRES_USER: ${CRUCIBLE_CONTROL_DATABASE_USERNAME:-crucible}
      POSTGRES_PASSWORD: ${CRUCIBLE_CONTROL_DATABASE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    volumes:
      - crucible_control_postgres:/var/lib/postgresql/data
    networks:
      - backend

  control-mysql:
    image: mysql:8.4
    profiles: ["control-mysql"]
    environment:
      MYSQL_DATABASE: ${CRUCIBLE_CONTROL_DATABASE_NAME:-crucible}
      MYSQL_USER: ${CRUCIBLE_CONTROL_DATABASE_USERNAME:-crucible}
      MYSQL_PASSWORD: ${CRUCIBLE_CONTROL_DATABASE_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    init: true
    restart: unless-stopped
    volumes:
      - crucible_control_mysql:/var/lib/mysql
    networks:
      - backend

  gateway:
    image: caddy:2.10-alpine
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "8000:8000"
    volumes:
      - ./.docker/native-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
      native-proxy:
        condition: service_healthy
    networks:
      - backend

  native-proxy:
    image: ${CRUCIBLE_NATIVE_IMAGE:?CRUCIBLE_NATIVE_IMAGE must be set to the matching native proxy release image}
    pull_policy: always
    environment:
      APP_URL: ${APP_URL:?APP_URL must be configured}
      NATIVE_PROXY_ID: ${NATIVE_PROXY_ID:-crucible-production}
      NATIVE_PROXY_CONTROL_URL: http://app:8000
      NATIVE_PROXY_CONTROL_SECRET: ${NATIVE_PROXY_CONTROL_SECRET:?NATIVE_PROXY_CONTROL_SECRET must be configured}
      NATIVE_PROXY_REDIS_URL: redis://redis:6379/0
      NATIVE_PROXY_REVOCATION_CHANNEL: ${NATIVE_PROXY_REVOCATION_CHANNEL:-native-proxy:lease-revoked}
      NATIVE_PROXY_MAX_CONNECTIONS: ${NATIVE_PROXY_MAX_CONNECTIONS:-100}
      NATIVE_PROXY_MAX_CONNECTIONS_PER_LEASE: ${NATIVE_PROXY_MAX_CONNECTIONS_PER_LEASE:-3}
      NATIVE_PROXY_MAX_CONNECTIONS_PER_USER: ${NATIVE_PROXY_MAX_CONNECTIONS_PER_USER:-10}
      NATIVE_PROXY_IDLE_TIMEOUT: ${NATIVE_PROXY_IDLE_TIMEOUT:-15m}
      NATIVE_PROXY_DRAIN_TIMEOUT: ${NATIVE_PROXY_DRAIN_TIMEOUT:-30s}
      NATIVE_PROXY_READINESS_INTERVAL: ${NATIVE_PROXY_READINESS_INTERVAL:-5s}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/usr/local/bin/crucible-proxy", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - proxy_egress

volumes:
  crucible_control_mysql:
  crucible_control_postgres:
  crucible_redis:
  crucible_storage:

networks:
  backend:
    internal: true
  proxy_egress: {}
