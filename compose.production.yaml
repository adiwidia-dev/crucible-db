services:
  app:
    image: ${CRUCIBLE_IMAGE:-hephaestus/crucible-db:alpha}
    pull_policy: always
    env_file:
      - ${CRUCIBLE_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CACHE_STORE: redis
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/crucible.sqlite
      DB_FOREIGN_KEYS: "true"
      DB_BUSY_TIMEOUT: "5000"
      DB_JOURNAL_MODE: WAL
      DB_SYNCHRONOUS: FULL
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      SESSION_DRIVER: redis
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8000:8000"
    volumes:
      - crucible_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped
    volumes:
      - crucible_redis:/data
    networks:
      - backend

volumes:
  crucible_redis:
  crucible_storage:

networks:
  backend:
    internal: true
