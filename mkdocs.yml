site_name: Crucible DB
site_description: Governed database operations, documented for the people who request, review, and operate them.
site_url: https://adiwidia-dev.github.io/crucible-db/
copyright: Copyright &copy; 2026 Crucible DB contributors

exclude_docs: |
  archive/
  architecture/
  product/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/crucible-mark.svg
  favicon: assets/brand/crucible-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Use light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: none
      zoomable: true
      draggable: true
      auto_themed: true
      auto_caption: true
      caption_position: bottom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  github_url: https://github.com/adiwidia-dev/crucible-db

extra_css:
  - stylesheets/extra.css

